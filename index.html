<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Zone</title>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9751556966464138"
     crossorigin="anonymous"></script>
</head>

<body style="margin:0; background:#121212; color:white; font-family:Arial; text-align:center;">

    <h1 style="padding-top:20px;">💎 Earn Zone</h1>

    <div style="
        width:90%;
        max-width:350px;
        margin:auto;
        background:#2D1D6B;
        border-radius:20px;
        padding:20px;
    ">
        <h2>Diamond: <span id="diamond">0</span></h2>

        <button onclick="addDiamond()" style="
            padding:12px 25px;
            border:none;
            border-radius:10px;
            background:#ff9800;
            color:white;
            font-size:16px;
        ">
            +1 Diamond
        </button>
    </div>

    <!-- AdSense Ad Area -->
    <div style="margin-top:20px;">
        <!-- AdSense ad unit code यहाँ paste करें -->
    </div>

    <script>
        let diamond = 0;

        function addDiamond() {
            diamond++;
            document.getElementById("diamond").innerText = diamond;
        }
    </script>

</body>
</html>
